<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a Free Quote - Pee Cleaning</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #fcf9f5;
      color: #1d2b3a;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 40px;
      padding: 3rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.05);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 300;
    }
    .header h1 i {
      color: #2f4b3c;
      margin-right: 10px;
    }
    .header p {
      color: #6f6f6f;
      margin-top: 0.5rem;
    }
    .contact-info {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .contact-info a {
      color: #1d2b3a;
      text-decoration: none;
      font-weight: 500;
    }
    .contact-info i {
      margin-right: 6px;
      color: #2f4b3c;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border: 2px solid #e7e0d8;
      border-radius: 40px;
      font-size: 1rem;
      transition: 0.2s;
      background: #faf8f6;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2f4b3c;
      background: white;
    }
    .form-group textarea {
      border-radius: 24px;
      resize: vertical;
      min-height: 100px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    
    .btn-submit {
      width: 100%;
      background: #2f4b3c;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      background: #1d3a2e;
      transform: scale(1.01);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .alert {
      padding: 1rem 1.5rem;
      border-radius: 30px;
      margin-top: 1rem;
      display: none;
    }
    .alert.show {
      display: block;
    }
    .alert.success {
      background: #d4e3d9;
      color: #1d4b3a;
    }
    .alert.error {
      background: #f5d4d4;
      color: #7a2e2e;
    }
    .alert.info {
      background: #d4d9e3;
      color: #1d2b4a;
    }

    .required {
      color: #c0392b;
      margin-left: 3px;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-left: 10px;
    }
    .status-badge.online {
      background: #d4e3d9;
      color: #1d4b3a;
    }
    .status-badge.offline {
      background: #f5d4d4;
      color: #7a2e2e;
    }
    .status-badge.checking {
      background: #f0e8d8;
      color: #7a6e5a;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .header h1 {
        font-size: 1.8rem;
      }
      .contact-info {
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-paper-plane"></i> Get a Free Quote</h1>
    <p>Fill in the form and we'll get back to you within 30 minutes</p>
    <div class="contact-info">
      <a href="https://wa.me/27736257946" target="_blank">
        <i class="fab fa-whatsapp"></i> +27 73 625 7946
      </a>
      <a href="mailto:reemkhadzi@gmail.com">
        <i class="fas fa-envelope"></i> reemkhadzi@gmail.com
      </a>
    </div>
    <div style="margin-top: 10px;">
      <span id="apiStatus" class="status-badge checking">
        <i class="fas fa-spinner fa-spin"></i> Checking connection...
      </span>
    </div>
  </div>

  <form id="quoteForm">
    <div class="form-row">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" required placeholder="+27 82 123 4567">
      </div>
      <div class="form-group">
        <label>Service <span class="required">*</span></label>
        <select id="service" required>
          <option value="">Select a service...</option>
          <option value="Pee & urine removal">Pee & urine removal</option>
          <option value="Home deep clean">Home deep clean</option>
          <option value="Office sanitation">Office sanitation</option>
          <option value="Upholstery & rug">Upholstery & rug</option>
          <option value="Move-in / move-out">Move-in / move-out</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Preferred Date <span class="required">*</span></label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label>Preferred Time</label>
        <input type="time" id="time">
      </div>
    </div>

    <div class="form-group">
      <label>Additional Details</label>
      <textarea id="message" placeholder="Address, special requests, or any additional information..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <i class="fas fa-paper-plane"></i> Send Quote Request
    </button>

    <div id="alert" class="alert"></div>
  </form>
</div>

<script>
  // ===== CONFIGURATION =====
  const API_URL = 'https://ree-housekeepers.onrender.com/api';
  // ===== SET DEFAULT DATE =====
  (function() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('date').value = tomorrow.toISOString().split('T')[0];
  })();

  // ===== TEST API CONNECTION =====
  async function testConnection() {
    const statusBadge = document.getElementById('apiStatus');
    statusBadge.className = 'status-badge checking';
    statusBadge.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
    
    try {
      console.log('🔍 Testing API connection...');
      const response = await fetch(`${API_URL}/test`);
      
      console.log('📥 Response status:', response.status);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const data = await response.json();
      console.log('✅ API connected:', data);
      
      statusBadge.className = 'status-badge online';
      statusBadge.innerHTML = '<i class="fas fa-circle"></i> Connected to server';
      
      return true;
    } catch (error) {
      console.error('❌ API connection failed:', error);
      
      statusBadge.className = 'status-badge offline';
      statusBadge.innerHTML = '<i class="fas fa-circle"></i> Server offline';
      
      const alert = document.getElementById('alert');
      alert.className = 'alert error show';
      alert.innerHTML = `
        <i class="fas fa-exclamation-circle"></i> 
        <strong>Cannot connect to server.</strong><br>
        Please make sure the backend is running on port 3000.<br>
        <small>Run: npm start in the backend folder</small>
      `;
      
      return false;
    }
  }

  // Test on page load
  document.addEventListener('DOMContentLoaded', function() {
    testConnection();
  });

  // ===== FORM SUBMISSION =====
  document.getElementById('quoteForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const alert = document.getElementById('alert');
    alert.className = 'alert';
    
    // Collect form data
    const formData = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      service: document.getElementById('service').value,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      message: document.getElementById('message').value.trim(),
      source: 'website'
    };

    // Validate
    if (!formData.name || !formData.email || !formData.phone || !formData.service || !formData.date) {
      alert.className = 'alert error show';
      alert.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please fill in all required fields.';
      return;
    }

    // Validate email format
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(formData.email)) {
      alert.className = 'alert error show';
      alert.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter a valid email address.';
      return;
    }

    // Disable button
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

    try {
      console.log('📤 Sending booking:', formData);
      
      const response = await fetch(`${API_URL}/bookings`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData)
      });

      console.log('📥 Response status:', response.status);
      
      // Check if response is ok
      if (!response.ok) {
        const text = await response.text();
        console.error('❌ Server error response:', text);
        throw new Error(`Server returned ${response.status}`);
      }
      
      const data = await response.json();
      console.log('📥 Response data:', data);

      if (data.success) {
        alert.className = 'alert success show';
        alert.innerHTML = `
          <i class="fas fa-check-circle"></i> 
          ✅ Thank you! Your quote request has been sent successfully.
          <br><small>Booking ID: #${data.id} - We'll respond within 30 minutes.</small>
        `;
        this.reset();
        // Reset date
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('date').value = tomorrow.toISOString().split('T')[0];
        
        // Scroll to alert
        alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        alert.className = 'alert error show';
        alert.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error || 'Something went wrong. Please try again.'}`;
      }
    } catch (error) {
      console.error('❌ Error:', error);
      alert.className = 'alert error show';
      alert.innerHTML = `
        <i class="fas fa-exclamation-circle"></i> 
        <strong>${error.message || 'Network error'}</strong><br>
        <small>Make sure the backend server is running on port 3000</small>
      `;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Quote Request';
    }
  });
</script>
</body>
</html>
